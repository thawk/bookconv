[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvbook"
version = "0.2.0"
description = "把 Markdown 小说转换成 EPUB，样式可定制"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ebooklib>=0.18",
    "markdown>=3.3",
]

[project.scripts]
cvbook = "cvbook.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvbook = ["data/*.css"]
