[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvbook"
version = "0.4.0"
description = "把 Markdown / txt / AsciiDoc / HTML / EPUB / CHM 转成 EPUB 或 Markdown"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ebooklib>=0.18",
    "html2text>=2020.1.16",
    "lxml>=4.6",
    "markdown>=3.3",
]

[project.scripts]
cvbook = "cvbook.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvbook = ["data/*.css"]
